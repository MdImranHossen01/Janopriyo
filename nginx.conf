server {
    server_name janopriyo.com www.janopriyo.com *.janopriyo.com;

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Real IP headers for Next.js
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/janopriyo.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/janopriyo.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Catch-all block: reseller custom domains
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Real IP headers for Next.js
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    if ($host = www.janopriyo.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = janopriyo.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name janopriyo.com www.janopriyo.com *.janopriyo.com;
    return 404; # managed by Certbot
}
